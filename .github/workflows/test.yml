name: Test Darkly Tools

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Ejecutar tests Python (pytest)
        run: pytest tests/test_darkly.py -v

      - name: Ejecutar tests Go
        run: |
          cd go
          go test ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Ejecutar tests Python (pytest)
        run: pytest tests/test_darkly.py -v

      - name: Ejecutar tests Go
        run: |
          cd go
          go test ./...
