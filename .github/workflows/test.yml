name: Test Darkly Tools

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-python:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar linters
        run: |
          python -m pip install --upgrade pip ruff black
      - name: Ejecutar ruff y black
        run: |
          ruff check darkly.py webapp.py install.py tools/ tests/ || true
          black --check darkly.py webapp.py install.py tools/ tests/ || true

  lint-go:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Ejecutar gofmt
        run: |
          gofmt -l go/ || true

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
      - name: Ejecutar tests Python con cobertura
        run: |
          pytest tests/test_darkly.py tests/test_webapp.py -v --cov=. --cov-report=term --cov-report=xml
      - name: Subir cobertura a Codecov (opcional)
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      - name: Ejecutar tests Go
        run: |
          cd go
          go test ./...

  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Ejecutar tests Python (pytest)
        run: pytest tests/test_darkly.py tests/test_webapp.py -v
      - name: Ejecutar tests Go
        run: |
          cd go
          go test ./...

  test-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Ejecutar tests Python (pytest)
        run: pytest tests/test_darkly.py tests/test_webapp.py -v
      - name: Ejecutar tests Go
        run: |
          cd go
          go test ./...
