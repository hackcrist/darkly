name: Docker Multi-Arch

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'

jobs:
  buildx:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Autenticar en GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraer metadatos de Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/darkly-api
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=raw,value=latest
          flavor: |
            suffix=-${{ github.ref_name == 'main' && 'latest' || '' }}

      - name: Construir y publicar imagen multi-arquitectura
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/darkly-api:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/darkly-api:buildcache,mode=max
