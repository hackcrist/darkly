<svg xmlns="http://www.w3.org/2000/svg" width="800" height="420" viewBox="0 0 800 420">
  <rect width="800" height="420" rx="16" fill="#0a0a14"/>
  <text x="400" y="36" text-anchor="middle" font-family="Consolas, monospace" font-size="22" font-weight="bold" fill="#e8e8f0">MÓDULOS DARKLY</text>
  <g font-family="Consolas, monospace">
    <rect x="30" y="60" width="220" height="140" rx="12" fill="#14142b" stroke="#00ffea" stroke-width="2"/>
    <text x="140" y="100" text-anchor="middle" font-size="34" fill="#00ffea">[···]</text>
    <text x="140" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">REDES</text>
    <text x="140" y="155" text-anchor="middle" font-size="13" fill="#aaaaaa">scan · dns · ping</text>
    <text x="140" y="175" text-anchor="middle" font-size="13" fill="#aaaaaa">subred · traceroute</text>
    <rect x="290" y="60" width="220" height="140" rx="12" fill="#14142b" stroke="#ff00ff" stroke-width="2"/>
    <text x="400" y="100" text-anchor="middle" font-size="34" fill="#ff00ff">[###]</text>
    <text x="400" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">SEGURIDAD</text>
    <text x="400" y="155" text-anchor="middle" font-size="13" fill="#aaaaaa">hash · auditoría HIBP</text>
    <text x="400" y="175" text-anchor="middle" font-size="13" fill="#aaaaaa">phishing · cabeceras</text>
    <rect x="550" y="60" width="220" height="140" rx="12" fill="#14142b" stroke="#b026ff" stroke-width="2"/>
    <text x="660" y="100" text-anchor="middle" font-size="34" fill="#b026ff">[o_o]</text>
    <text x="660" y="130" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">OSINT</text>
    <text x="660" y="155" text-anchor="middle" font-size="13" fill="#aaaaaa">geo · RDAP · WHOIS</text>
    <text x="660" y="175" text-anchor="middle" font-size="13" fill="#aaaaaa">usuarios · GitHub</text>
    <rect x="30" y="230" width="220" height="140" rx="12" fill="#14142b" stroke="#39ff14" stroke-width="2"/>
    <text x="140" y="270" text-anchor="middle" font-size="34" fill="#39ff14">[___]</text>
    <text x="140" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">SISTEMA</text>
    <text x="140" y="325" text-anchor="middle" font-size="13" fill="#aaaaaa">sysinfo · disco · CPU</text>
    <text x="140" y="345" text-anchor="middle" font-size="13" fill="#aaaaaa">hash archivos · logs</text>
    <rect x="290" y="230" width="220" height="140" rx="12" fill="#14142b" stroke="#ffe600" stroke-width="2"/>
    <text x="400" y="270" text-anchor="middle" font-size="34" fill="#ffe600">[@]</text>
    <text x="400" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">IP / INFO</text>
    <text x="400" y="325" text-anchor="middle" font-size="13" fill="#aaaaaa">mapa · informe 10/10</text>
    <text x="400" y="345" text-anchor="middle" font-size="13" fill="#aaaaaa">HTML TXT CSV PDF</text>
    <rect x="550" y="230" width="220" height="140" rx="12" fill="#14142b" stroke="#0096ff" stroke-width="2"/>
    <text x="660" y="270" text-anchor="middle" font-size="34" fill="#0096ff">{;}</text>
    <text x="660" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#ffffff">GO + PY</text>
    <text x="660" y="325" text-anchor="middle" font-size="13" fill="#aaaaaa">mismos módulos</text>
    <text x="660" y="345" text-anchor="middle" font-size="13" fill="#aaaaaa">JSON entre ellos</text>
  </g>
